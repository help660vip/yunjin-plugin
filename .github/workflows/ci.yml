name: YunJin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: ['18.18.x', '20.x', '22.x']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --ignore-scripts --no-package-lock
      - run: npm run lint
      - run: npm test
      - run: npm run test:features
      - run: npm run test:compat:trss
      - run: npm run test:compat:miao
      - run: npm run test:render
      - run: npm run test:smoke
      - run: npm run pack:dry-run
